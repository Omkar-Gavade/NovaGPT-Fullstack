name: deploy

# Build once, promote the same artefact.
#
# The image that reaches production is byte-identical to the one that passed the
# tests and was smoke-tested in staging. Rebuilding per environment means
# production runs a binary nothing verified — and the difference only ever
# surfaces in production (docs/backend/13-deployment.md#cicd).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  # ── Build, verify, publish ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # The `verify` stage runs the full suite inside the image, against the
      # same lockfile the runtime layer installs. Testing in a separate job with
      # a separate `npm ci` proves the tests pass somewhere — not that they pass
      # for what ships.
      - uses: docker/setup-buildx-action@v3
      - name: Build and test the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          target: verify
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the runtime image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          target: runtime
          push: true
          # Digest-pinned everywhere downstream. A tag can move; a digest cannot,
          # so "roll back to what was running" is unambiguous.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Scan the published image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          # Fails the job. A scan that only reports is a scan everyone scrolls
          # past (docs/backend/10-security.md#security-in-the-development-lifecycle).
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json

  # ── Staging ────────────────────────────────────────────────────────────
  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Roll out to staging
        run: |
          ./ops/deploy/rollout.sh staging "${{ env.IMAGE }}@${{ needs.build.outputs.digest }}"

      # The gate that decides whether this build is promotable. It exercises the
      # real product path — sign in, send a message, read it back — because a
      # health check answering 200 says nothing about whether chat works.
      - name: Smoke test
        run: ./ops/deploy/smoke.sh "${{ secrets.STAGING_URL }}"

      # Every degradation-matrix row, verified where it is safe to break things.
      - name: Chaos exercises
        run: npm --prefix Backend run test:chaos
        env:
          TARGET_URL: ${{ secrets.STAGING_URL }}

  # ── Production ─────────────────────────────────────────────────────────
  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    # A protected environment with required reviewers. The approval is a human
    # deciding that staging looked right — the one check no pipeline can make.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Record what is running, for the rollback
        id: current
        run: echo "digest=$(./ops/deploy/current-digest.sh production)" >> "$GITHUB_OUTPUT"

      - name: Rolling deploy
        run: ./ops/deploy/rollout.sh production "${{ env.IMAGE }}@${{ needs.build.outputs.digest }}"

      - name: Smoke test
        id: smoke
        run: ./ops/deploy/smoke.sh "${{ secrets.PRODUCTION_URL }}"

      # Automatic, and it does not depend on anyone being awake. A rollback that
      # needs a human is a rollback that happens after the incident channel has
      # already filled up.
      - name: Roll back on failure
        if: failure() && steps.current.outputs.digest != ''
        run: |
          echo "::error::Smoke test failed — rolling back to ${{ steps.current.outputs.digest }}"
          ./ops/deploy/rollout.sh production "${{ steps.current.outputs.digest }}"
          ./ops/deploy/smoke.sh "${{ secrets.PRODUCTION_URL }}"
          exit 1
